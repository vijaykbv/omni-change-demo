name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Fake deploy
        run: |
          echo "Deploying ${{ github.sha }} to ${{ github.event.inputs.environment || 'staging' }}"
          cat config.json
          sleep 20
